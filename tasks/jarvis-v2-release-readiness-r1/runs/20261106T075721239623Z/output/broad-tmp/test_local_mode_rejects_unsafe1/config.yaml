agent:
  checkpoint_interval_seconds: 60
  hermes_cli_path: hermes
  hermes_enabled: false
  hermes_workspace: ~/.hermes
  max_concurrent_tasks: 3
  task_timeout_seconds: 3600
boot:
  animation_delay_ms: 500
  enabled: true
  music_file: ./assets/audio/boot_intro.wav
  music_volume: 0.7
  report_items:
  - time
  - gpu_temp
  - last_project
  - pending_tasks
  status_report: true
comms:
  discord_channel_id: ''
  discord_enabled: false
  discord_token: ''
  require_approval_for_remote: true
  telegram_chat_id: ''
  telegram_enabled: false
  telegram_token: ''
computer:
  gesture_camera_index: 0
  gesture_enabled: false
  screenshot_format: PNG
  screenshot_quality: 85
  use_open_computer_use: false
logging:
  audit_log: ./logs/audit.jsonl
  level: INFO
  log_file: ./logs/jarvis.log
  log_to_file: true
  max_log_size_mb: 100
memory:
  chromadb_collection: jarvis_knowledge
  chromadb_enabled: false
  chromadb_path: ./data/chroma
  graphiti_enabled: false
  index_paths:
  - ./projects
  - ./docs
  - ./datasheets
  mem0_base_url: http://localhost:8001
  mem0_enabled: false
  neo4j_password_env: NEO4J_PASSWORD
  neo4j_uri: bolt://localhost:7687
  neo4j_user: neo4j
models:
  coder: qwen2.5-coder:14b
  coder_context: 32768
  main: qwen3-nothink
  main_context: 32768
  ollama_base_url: http://localhost:11434
  router: gemma3:4b
  router_context: 4096
  vision: qwen3-vl
  vision_context: 8192
openjarvis:
  optimization_enabled: false
  trace_logging_enabled: true
  traces_dir: ./data/traces
paths:
  assets_dir: ./assets
  datasheets_dir: D:/Datasheets
  downloads_dir: D:/Downloads
  logs_dir: ./logs
  models_dir: ./models
  projects_dir: D:/Projects
resource_mode:
  auto_deep_sleep: true
  auto_light_sleep: true
  deep_sleep_timeout_minutes: 60
  enabled: true
  idle_timeout_minutes: 10
  keep_wake_listener_in_deep_sleep: false
  keep_wake_listener_in_light_sleep: true
  preload_keep_alive: 5m
  preload_primary_model_on_wake: false
  stop_server_on_auto_deep_sleep: true
routing:
  embedding_enabled: false
  embedding_model: nomic-embed-text
  embedding_top_k: 3
safety:
  approval_mode: balanced
  confidence_threshold: 0.75
  dry_run: false
  max_tool_chain: 5
server:
  api_token: ''
  cors_origins:
  - http://192.168.1.10:3000
  enable_hotkey_listener: false
  enable_voice_on_startup: false
  host: 127.0.0.1
  port: 8000
  remote_access_enabled: false
  tailscale_hostname: ''
  ue5_enabled: false
  websocket_path: /ws
tools:
  obsidian_enabled: false
  obsidian_vault_path: ./jarvis-vault
voice:
  dictation_enabled: true
  dictation_hotkey: ctrl+shift+space
  dictation_type_out: false
  input_device_index: -1
  kokoro_speed: 1.0
  kokoro_voice: af_jarvis
  output_device_index: -1
  piper_config_path: ./models/en_US-lessac-high.onnx.json
  piper_model_path: ./models/en_US-lessac-high.onnx
  push_to_talk_key: ctrl+space
  stt_compute_type: float16
  stt_device: cuda
  stt_model: large-v3-turbo
  tts_engine: chatterbox
  vad_aggressiveness: 3
  voice_clone_path: ''
  wake_word_model: hey_jarvis
  wake_word_sensitivity: 0.5
