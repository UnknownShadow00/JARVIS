name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Operator-owned label for a disposable, prequalified hosted image. Never
    # point PR jobs at a trusted/persistent self-hosted or production machine.
    # The fallback stays active and fails closed if the bundle is unavailable.
    runs-on: ${{ vars.JARVIS_QUALIFIED_OFFLINE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No installs or broad pytest fallback. An unqualified hosted image must
      # fail, not yield a green partial check. Runner provisioning/qualification
      # is a separate operator task; do not execute PR code on trusted hosts.
      - name: Complete qualified offline acceptance
        run: python3 -B scripts/offline_acceptance.py --output-dir "$RUNNER_TEMP/jarvis-offline-acceptance"
