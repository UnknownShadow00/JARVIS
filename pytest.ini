[pytest]
addopts = -m "not desktop and not manual and not hardware and not slow and not e2e and not stress and not perf"
markers =
    desktop: deterministic test requiring desktop/audio/GUI dependencies
    manual: requires real audio/video hardware — skipped by default
    hardware: requires physical hardware (GPU, mic, camera) — skipped by default
    unit: fast unit test with mocked dependencies
    slow: long-running stress or load tests — skipped by default
    e2e: end-to-end tests — skipped by default
    stress: stress/load tests — skipped by default
    perf: performance benchmarks — skipped by default
